name: Linux compatibility tests

on:
  push:
    branches: ['codex/**']

permissions:
  contents: read

concurrency:
  group: linux-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact source and complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run complete isolated Linux checks
        env:
          CI_SOURCE_SHA: ${{ github.sha }}
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_REF: ${{ github.ref }}
          CI_REPORT_PATH: ${{ runner.temp }}/puppyip-results/summary.json
          CI_PRIVATE_ROOT: ${{ runner.temp }}
        run: >-
          sudo -n --preserve-env=GITHUB_ACTIONS,CI_SOURCE_SHA,CI_WORKFLOW_SHA,CI_RUN_ID,CI_RUN_ATTEMPT,CI_REPOSITORY,CI_REF,CI_REPORT_PATH,CI_PRIVATE_ROOT
          python3 tests/ci.py
      - name: Retain sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/puppyip-results/summary.json
          if-no-files-found: error
          retention-days: 30
